services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: emc_wenku_dev
      POSTGRES_USER: emc_wenku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - emc_wenku_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emc_wenku -d emc_wenku_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  emc_wenku_postgres:
