name: Deploy EarthMC literature archive to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "emc-wenku/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: emc-wenku/package-lock.json

      - name: Install and build
        working-directory: emc-wenku
        env:
          DATABASE_URL: postgresql://ci:ci-placeholder@127.0.0.1:5432/emc_wenku_ci?schema=public
        run: |
          npm ci
          npm run db:generate
          npm run api:build
          npm run build
          cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: emc-wenku/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
